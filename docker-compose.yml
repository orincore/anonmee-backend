services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: anonme
      POSTGRES_PASSWORD: anonme_dev
      POSTGRES_DB: anonme
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
